version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # Group minor/patch updates into a single PR to reduce noise
      production:
        dependency-type: production
        update-types: [minor, patch]
      dev:
        dependency-type: development
        update-types: [minor, patch]
    # Major updates get individual PRs since they may have breaking changes
    open-pull-requests-limit: 10
    ignore:
      # @types/node follows the Node major the image runs (node:24-alpine), not
      # the newest Node line; move it together with the base image.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # Batch all GitHub Actions bumps into one PR instead of one-per-action
      actions:
        patterns: ["*"]
