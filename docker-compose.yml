services:
  callsheet:
    build: .
    container_name: callsheet
    restart: unless-stopped
    env_file: .env
    environment:
      MODE: headless_docker
      CRON_SCHEDULE: "30 6 * * *"
      TZ: ${TZ:-UTC}
      # Scheduled briefs print by default (to the printer set in config.yaml).
      # Set to "false" for a UI-only / no-printer deployment.
      PRINT_BRIEF: "true"
      # The container has no local CUPS daemon — point `lp` at a CUPS server
      # that has the printer configured (e.g. the Docker host). Either use the
      # host's socket through the /run/cups mount below, or a network server.
      # CUPS_SERVER: /run/cups/cups.sock
      # CUPS_SERVER: "host.docker.internal:631"
      # Produce a missed brief late, up to this many hours after its time.
      # CATCHUP_HOURS: "6"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./output:/app/output
      # Writable: Google OAuth token refresh persists back into this dir.
      - ./secrets:/app/secrets
      # Host CUPS, for CUPS_SERVER=/run/cups/cups.sock. Mount the DIRECTORY:
      # CUPS recreates its socket when it restarts (often nightly), and a
      # single-file mount would stay pinned to the dead one.
      # - /run/cups:/run/cups:ro
